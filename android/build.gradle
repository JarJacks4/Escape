allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("kotlin")) {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
                kotlinOptions {
                    jvmTarget = "1.8"
                }
            }
            if (project.hasProperty("android")) {
                project.android.kotlinOptions {
                    // Kotlin 2.2 no longer accepts language/API levels below
                    // 1.8, which some older plugins still explicitly request.
                    def minimumSupportedVersion = org.gradle.util.GradleVersion.version("1.8")
                    if (languageVersion != null &&
                            org.gradle.util.GradleVersion.version(languageVersion) < minimumSupportedVersion) {
                        languageVersion = "1.8"
                    }
                    if (apiVersion != null &&
                            org.gradle.util.GradleVersion.version(apiVersion) < minimumSupportedVersion) {
                        apiVersion = "1.8"
                    }
                }
            }
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 36
            }
        }
        if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
