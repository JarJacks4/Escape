name: escape_soundscapes
description: Embeds the native Escape Soundscapes module (iOS 17+).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: EscapeSoundscapesPlugin
